<!doctype html><html lang="ko" data-mode="light" data-view="boot"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>킴스 매출 리포트</title><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"><style>
:root{--bg:#f5f5f7;--panel:#fff;--fg:#1d1d1f;--muted:#7a7a7a;--line:#e0e0e0;--ac:#0066cc;--ac-soft:#eef5fd;--good:#1d8a4e;--bad:#d1302b;--ly:#d2d2d7;--tabbg:rgba(245,245,247,.8);--on-ac:#fff;--seg:#e3e3e8;
--font:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{position:relative;max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px}
.rad{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.date{margin:8px 0 6px;padding-right:92px;color:var(--muted);font-size:14px;line-height:1.45}
.date b{display:block;color:var(--fg);font-weight:700;font-size:18px;letter-spacing:-0.02em}
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px;background:var(--tabbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabs{display:flex;gap:6px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:9999px;font-weight:600;font-size:15px;cursor:pointer;color:var(--fg);background:var(--panel);border:1px solid var(--line);transition:transform .12s;user-select:none}
.tab:active{transform:scale(.95)}
.view{display:grid;gap:14px;margin-top:10px;grid-template-columns:minmax(0,1fr)}
.seg{display:flex;padding:3px;margin-bottom:8px;border-radius:9999px;background:var(--seg)}
.seg label{flex:1;text-align:center;padding:6px 0;border-radius:9999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;transition:transform .12s}
.seg label:active{transform:scale(.95)}
.hd{padding:6px 2px 0}
.eyebrow{margin:0 0 6px;color:var(--muted);font-size:12px;letter-spacing:.02em}
h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.025em;line-height:1.3;text-wrap:balance;word-break:keep-all}
h1 .sl{color:var(--muted);font-weight:400}
.sub{margin:8px 0 0;color:var(--muted);word-break:keep-all}
h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.02em}
h4{margin:16px 0 6px;font-size:14px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.note{margin:0 0 8px;color:var(--muted);font-size:12px;word-break:keep-all}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.kl{margin:0;color:var(--muted);font-size:13px}
.kv{margin:2px 0 6px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.kv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-weight:600;font-size:11px;color:#fff}
.badge.g{background:var(--good)}.badge.b{background:var(--bad)}
.up{color:var(--good)}.dn{color:var(--bad)}
.lg{margin:0 0 10px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:9999px}.sw.ty{background:var(--ac)}.sw.ly{background:var(--ly)}
.bars{display:grid;gap:12px}
.sbh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.sb.me .sbh span{color:var(--ac);font-weight:600}
.br{display:flex;align-items:center;gap:8px;margin-top:3px}
.bar{display:block;height:12px;border-radius:9999px;min-width:2px}
.bar.ty{background:var(--ac)}.bar.ly{background:var(--ly)}
.br em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.dt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
.dt col.c0{width:27%}
.dt th,.dt td{padding:6px 4px;text-align:right;word-break:keep-all;overflow-wrap:anywhere}
.dt thead th{border-bottom:1.5px solid var(--fg)}
.dt tbody{border-bottom:1px solid var(--muted)}
.dt tbody tr+tr th,.dt tbody tr+tr td{border-top:1px dashed var(--line)}
.dt thead th{font-weight:600;color:var(--muted);font-size:12px}
.dt tbody th{text-align:left;font-weight:500;color:var(--muted)}
.dt .ya{background:var(--ac-soft)}
.dt thead th.ya{color:var(--ac)}
.gb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.pts li{display:grid;gap:2px;word-break:keep-all}
.pts li span{color:var(--muted);font-size:13px}
.mcl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mcl li{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.2em;gap:8px;align-items:center;font-size:13px}
.mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{display:block;height:10px}
.track i{display:block;height:10px;border-radius:9999px}
.track i.bu{background:var(--good)}.track i.bd{background:var(--bad)}
.mv{text-align:right;font-weight:600}
.prods{list-style:none;margin:0;padding:0}
.prods li{padding:9px 0;border-bottom:1px solid var(--line)}
.prods li:last-child{border-bottom:0}
.pn{font-size:14px;word-break:keep-all}
.rk{display:inline-block;min-width:1.6em;color:var(--ac);font-weight:600}
.muted{color:var(--muted);font-size:12px}
.pv{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;padding-left:1.6em;font-size:12px;color:var(--muted)}
.pv .sum{color:var(--fg);font-weight:600}
.pv .hi{color:var(--ac);font-weight:700}
.pv .lo{color:var(--bad);font-weight:700}
.dkw{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));z-index:6}
.dk{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:9999px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.dk i{position:relative;display:block;width:30px;height:18px;border-radius:9999px;background:var(--seg);transition:background .15s}
.dk i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
#dk:checked~.dkw .dk i{background:var(--ac)}
#dk:checked~.dkw .dk i::after{transform:translateX(12px)}
#dk:checked~.dkw .dk{color:var(--fg)}
#dk:focus-visible~.dkw .dk{outline:2px solid var(--ac);outline-offset:2px}
.hs{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 -4px}
.st{border-collapse:collapse;font-size:13px;min-width:100%;white-space:nowrap}
.st th,.st td{padding:7px 8px;text-align:right}
.st thead th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1.5px solid var(--fg)}
.st tbody th,.st tfoot th{text-align:left;font-weight:600}
.st tbody th small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.st tbody tr+tr th,.st tbody tr+tr td{border-top:1px dashed var(--line)}
.st tfoot tr{border-top:1.5px solid var(--fg)}
.st tfoot th,.st tfoot td{font-weight:700}
.st tr.cd th,.st tr.cd td{background:var(--ac-soft);font-weight:700}
.st tr.pg th{padding-left:22px;font-weight:500;color:var(--muted)}
.ht tr.cd th{font-weight:700}
.ht tr.pg th{padding-left:14px;color:var(--muted);font-size:11px}
.rkb{display:inline-block;min-width:2.4em;text-align:center;padding:1px 6px;border-radius:9999px;font-size:11px;font-weight:700;color:#fff}
.rkb.g{background:var(--good)}.rkb.b{background:var(--bad)}
.ht{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px;font-size:12px}
.ht col.c0{width:6.2em}
.ht tr.sep td{padding:0;height:0;border-top:1.5px solid var(--muted);border-radius:0;background:none}
.ht th,.ht td{padding:7px 4px;text-align:center;border-radius:8px}
.ht thead th{font-weight:600;color:var(--muted)}
.ht thead th.ya{color:var(--ac)}
.ht tbody th{text-align:left;font-weight:500;color:var(--fg);word-break:keep-all}
.ht td{font-weight:600;color:var(--fg)}
.ht td.ya{outline:1.5px solid var(--ac);outline-offset:-1.5px}
@media (max-width:600px){h1{font-size:1.25rem}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.gb{grid-template-columns:minmax(0,1fr)}.panel{padding:14px}.kv{font-size:21px}.dt{font-size:12px}.dt th,.dt td{padding:6px 2px}}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

:root[data-mode=dark]{--bg:#000;--panel:#1c1c1e;--fg:#f5f5f7;--muted:#98989d;--line:#38383a;--ac:#2997ff;--ac-soft:#0f2236;--good:#30d158;--bad:#ff6961;--ly:#48484a;--tabbg:rgba(0,0,0,.72);--seg:#2c2c2e;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-mode=system]:not([data-theme=light]){--bg:#000;--panel:#1c1c1e;--fg:#f5f5f7;--muted:#98989d;--line:#38383a;--ac:#2997ff;--ac-soft:#0f2236;--good:#30d158;--bad:#ff6961;--ly:#48484a;--tabbg:rgba(0,0,0,.72);--seg:#2c2c2e;color-scheme:dark}}
:root[data-mode=system][data-theme=dark]{--bg:#000;--panel:#1c1c1e;--fg:#f5f5f7;--muted:#98989d;--line:#38383a;--ac:#2997ff;--ac-soft:#0f2236;--good:#30d158;--bad:#ff6961;--ly:#48484a;--tabbg:rgba(0,0,0,.72);--seg:#2c2c2e;color-scheme:dark}
:root{--hov:color-mix(in srgb,var(--ac) 9%,transparent);--sk:color-mix(in srgb,var(--fg) 9%,transparent);--sk2:color-mix(in srgb,var(--fg) 16%,transparent);--shadow:0 12px 40px rgba(0,0,0,.28)}.dc .dcs{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:8px -4px 0;padding-bottom:6px;max-width:100%}
.dc svg{display:block}
.dc svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.dc .bd{fill:var(--ac-soft)}
.dc .ax{stroke:var(--line);stroke-width:1}
.dc path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.dc path.ly{stroke:var(--ly);stroke-width:2}
.dc circle.ly{fill:var(--ly)}
.dc path.ty{stroke:var(--ac);stroke-width:3}
.dc circle.ty{fill:var(--ac)}
.dc text.v{font-size:11px;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.dc text.v.ly{fill:var(--muted);opacity:.75}
.dc text.v.ty{fill:var(--fg);font-weight:700;font-size:12px}
.dc text.g{font-size:11px;font-weight:600}
.dc text.gu{fill:var(--good)}.dc text.gd{fill:var(--bad)}
.dc text.dt{font-size:11px;fill:var(--muted)}
.dc text.sun{fill:var(--bad)}.dc text.sat{fill:var(--ac)}
.sw.lyl{background:var(--ly)}
.dc .lym{margin-left:8px}
.dc .lym b{color:var(--fg);font-weight:600}

/* ── 앱 틀: 헤더 고정 + 본문 안쪽 스크롤 (카카오톡 미리보기에서도 헤더 고정) ── */
html,body{height:100%;overflow:hidden}
body{background:var(--bg)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.hdr{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"menu title seg set";align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--tabbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hdr .menu{grid-area:menu}.hdr .ttl{grid-area:title;min-width:0}.hdr .seg{grid-area:seg;margin:0;min-width:220px}.hdr .set{grid-area:set}
.ttl b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:background .2s,border-color .2s,transform .12s}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.94)}
.seg button{font:inherit;border:0;cursor:pointer;flex:1;padding:6px 0;border-radius:9999px;font-size:14px;font-weight:600;color:var(--muted);background:none;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ac);box-shadow:0 0 0 1px var(--line)}
.seg[hidden]{display:none}
.body{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}
#nav{overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
#scroller{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#main{max-width:1240px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hd{padding:14px 2px 2px}
/* 사이드바 */
.nl{margin:16px 8px 8px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.nl:first-child{margin-top:0}
.nv,.toc{list-style:none;margin:0;padding:0}
.nv>li>button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;font-weight:600;color:var(--fg);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;transition:background .2s,color .2s}
.nv>li>button[aria-current=page]{background:var(--ac);color:var(--on-ac)}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0 10px}
.toc a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;padding:8px 4px;font-size:12.5px;font-weight:600;line-height:1.25;text-align:center;word-break:keep-all;color:var(--muted);text-decoration:none;border-radius:12px;background:var(--seg);border:1px solid transparent;transition:background .2s,color .2s,border-color .2s}
.toc a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.toc a.on{color:var(--ac);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
/* 상단 카테고리 아이콘 */
.app.has-cats .hdr{grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"menu title cats seg set"}
.cats{grid-area:cats;display:flex;gap:4px;min-width:0}
.cats[hidden],.cats button[hidden]{display:none}
.cats button{display:grid;justify-items:center;gap:2px;min-width:52px;padding:5px 6px 4px;font:inherit;font-size:11px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;border-radius:12px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.cats svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cats button[aria-pressed=true]{color:var(--ac);background:var(--ac-soft);border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
@media (hover:hover){.cats button:not([aria-pressed=true]):hover{color:var(--fg);background:var(--hov)}}
@media (max-width:1279px){.app.has-cats .hdr{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"menu title seg set" "cats cats cats cats"}.cats{justify-content:space-between;overflow-x:auto}.cats button{flex:1}}
@media (max-width:640px){.app.has-cats .hdr{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"menu title set" "cats cats cats" "seg seg seg"}.cats button{min-width:44px;padding:4px 2px}.cats svg{width:20px;height:20px}}
.ht.pgg{min-width:300px}
@media (max-width:600px){.ht.pgg th,.ht.pgg td{padding:6px 1px;font-size:11px}.ht.pgg col.c0{width:4.6em}}
.pend{padding:10px 12px;border-radius:10px;background:var(--seg);margin-top:4px}
/* 사이드바 점포별 실적 */
.ns{margin:0;padding:9px 10px 4px;font-size:15px;font-weight:700}
.nl small{font-size:12px;font-weight:500;letter-spacing:0;margin-left:4px}
.ng{margin:0 0 2px}
.ng summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;transition:background .2s}
.ng summary::-webkit-details-marker{display:none}
.ng summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none}
.ng[open] summary::before{transform:rotate(45deg)}
.ng summary span{flex:1}.ng summary small{color:var(--muted);font-weight:500}.ng summary b{font-size:12px}
.sl{list-style:none;margin:0 0 6px;padding:0 0 0 14px}
.sl button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:inherit;font-size:14px;color:var(--fg);background:none;border:0;border-radius:9px;padding:7px 10px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.sl button b{font-size:12px;font-weight:600}
.sl button[aria-current=page]{background:var(--ac-soft);color:var(--ac);font-weight:700}
@media (hover:hover){.ng summary:hover,.sl button:not([aria-current=page]):hover{background:var(--hov)}.sl button:hover span{color:var(--ac)}}
.seg3:has(> :nth-child(4)) .rb span{font-size:13px}
/* 섹션 줄: PC 50:50, 좁으면 세로 */
.row{display:grid;gap:14px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
.panel.bare{background:none;border:0;padding:0}
@media (min-width:1440px){.row.split{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}.row.split>.panel{height:100%;box-sizing:border-box}}
.gbi{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}.gbi h4{margin:0 0 4px;font-size:16px}.gbi ul{margin-bottom:0}
@media (min-width:900px){.gbi{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.gbi>div+div{border-left:1px solid var(--line);padding-left:28px}}
/* 상세 비교 표 여러 개: PC에서 2열 격자, 칸 너비 고정 */
.dts{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.dts{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}.dts:has(>.dtw:only-child){grid-template-columns:minmax(0,1fr)}}
.dtw h4{margin-top:0}.dt{table-layout:fixed;width:100%}
/* 점포 매출 막대: 넓은 화면 2열 */
@media (min-width:1400px){.row:not(.split) .bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}}
/* 스크롤 리빌 (처음부터 보이는 상태에서 살짝 올라옴) */
.row.rv{opacity:.35;transform:translateY(18px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.row.rv.in{opacity:1;transform:none}
/* 차례 등장 (stagger 0.1초) — 리빌 전 줄은 기다렸다가 들어올 때 시작 */
.stg>*{animation:up .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * .1s)}
.row.rv:not(.in) .stg>*{animation:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 일별 그래프 날짜 팝업 */

  // 점포 순위 표: 매출·성장율·순위 | 매총율·증감 | 객수(일평균)·증감율 | 객단가·증감율

  // 객수 × 객단가 4분면: 점포별 객수 증감율(가로) · 객단가 증감율(세로) · 원 크기 = 매출 규모 · 색 = 매출 증감

      .filter(function (o) { return o.x != null && o.y != null && isFinite(o.x) && isFinite(o.y); });

    };
    // 이름표: 겹치면 오른쪽 → 왼쪽 → 위 → 아래 순으로 비켜 놓고, 그래도 겹치면 생략(마우스 올리면 보임)

    pts.slice().sort(function (a, b) { return b.s - a.s; }).forEach(function (o) {
      var cx = X(o.x), cy = Y(o.y), r = rad(o), w = NAME[o.p].length * (m ? 10 : 12) + 4, h = 14;

    pts.slice().sort(function (a, b) { return b.s - a.s; }).forEach(function (o) {
      var cx = X(o.x), cy = Y(o.y), r = rad(o), w = NAME[o.p].length * (m ? 10 : 12) + 4, h = m ? 13 : 15;

      ticks(rx).map(function (v) { return v === 0 ? '' : '<line class="gr" x1="' + X(v) + '" x2="' + X(v) + '" y1="' + T + '" y2="' + (H - B) + '"/>'; }).join('') +

      '<text class="ax" x="' + ((L + W - R) / 2) + '" y="' + (H - 8) + '" text-anchor="middle">객수 증감율 (전년 대비)</text>' +

          '<text x="' + (lb ? lb[0] : cx + rad(o) + 4).toFixed(1) + '" y="' + (lb ? lb[1] : cy + 5).toFixed(1) + '" text-anchor="' + (lb ? lb[2] : 'start') + '">' + esc(NAME[o.p]) + '</text></g>';
      }).join('') + '</svg>';
    };

  // ── 전점 요약 (리더용) ──
  function allView(k) {
    var sc = scopeStore(k), K = OPEN(), kt = M(k, ALL(), sc);
    var gRows = [['킴스 합계', ALL(), true]].concat(D.groups.map(function (g) { return [g[1] + ' ' + g[2].length + '점' + (g[0] === D.closed ? '<small>영업중단</small>' : ''), g[2]]; }));
    var gt = '<p class="note">매출 백만원 · 객단가 만원 · 킴스 합계 = 영업중단 점포 포함 ' + ALL().length + '점</p>' + mtab('ms-grp', '<table class="gt mtbl">' + metricHead('구분', false) + '<tbody>' +
      gRows.map(function (r) { var t = M(k, r[1], sc); return '<tr' + (r[2] ? ' class="tot"' : '') + '><th>' + r[0] + '</th>' + metricCells(t, null) + '</tr>'; }).join('') + '</tbody></table>');

      if (CONFIRM !== 'del' + t.dataset.id) { CONFIRM = 'del' + t.dataset.id; t.textContent = '한 번 더 누르면 삭제'; setTimeout(function () { if (CONFIRM === 'del' + t.dataset.id) { CONFIRM = null; t.textContent = '삭제'; } }, 3000); return; }
      CONFIRM = null; t.disabled = true;
      authApi({ action: 'noticeDelete', id: t.dataset.id }).then(function (r) { if (!r.ok) throw new Error(r.err); toast('삭제했습니다'); return refreshPortal(); }, function (err) { t.disabled = false; toast(err.message, true); });
    }
    else if (t.dataset.uf) { UF = t.dataset.uf; drawPortal(); }
    else if (act === 'ureload') { USERS = null; drawPortal(); loadUsers(); }
    else if (t.dataset.uop) {
      var li = t.closest('[data-email]'), email = li.dataset.email, op = t.dataset.uop;
      var label = { approve: '승인', reject: t.textContent, reset: '비밀번호 초기화' }[op];
      if (op !== 'approve' && CONFIRM !== op + email) { CONFIRM = op + email; t.textContent = '한 번 더 누르면 ' + label; setTimeout(function () { if (CONFIRM === op + email) { CONFIRM = null; t.textContent = label; } }, 3000); return; }
      CONFIRM = null; li.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      authApi({ action: 'userSet', email: email, op: op }).then(function (r) {
        if (!r.ok) throw new Error(r.err);
        toast({ approve: '승인했습니다', reject: label === '승인 취소' ? '승인을 취소했습니다' : '거절했습니다', reset: '비밀번호를 초기화했습니다' }[op]);
        loadUsers(); refreshPortal();
      }, function (err) { toast(err.message, true); drawPortal(); });
    }
  });
  portal.addEventListener('submit', function (e) {
    if (e.target.id !== 'nForm') return; e.preventDefault();
    var title = $('nTitle').value.trim(), b = $('nSave');
    if (!title) { toast('제목을 입력해 주세요', true); return; }
    b.disabled = true; b.textContent = '저장 중…';
    var isNew = EDIT === 'new';
    authApi({ action: 'noticeSave', id: isNew ? '' : EDIT, title: title, body: $('nBody').value, pinned: $('nPin').checked, popup: $('nPop').checked }).then(function (r) {
      if (!r.ok) throw new Error(r.err);
      EDIT = null; OPEN[r.id] = true; MINE[r.id] = 1; toast(isNew ? '공지를 등록했습니다' : '공지를 수정했습니다');
      return refreshPortal().then(function () { var n = P && P.notices && P.notices.filter(function (x) { return x.id === r.id; })[0]; if (n && n.unread) { markRead([n.key]); drawPortal(); } }); // 쓴 사람에겐 '새 공지' 표시 안 함
    }, function (err) { b.disabled = false; b.textContent = isNew ? '등록' : '저장'; toast(err.message, true); });
  });

  // ───────── 매출 리포트 ─────────
  var started = false, loading = false;
  function openReport() {
    setView('report');
    if (started) { window.dispatchEvent(new Event('resize')); return; } // 숨겨져 있던 사이 크기 바뀐 것 반영
    if (!loading) loadReport();
  }
  function start(data, a, r) {
    var web = {
      admin: r ? r.admin : a.admin, name: r ? r.name : a.name,
      prefs: r ? r.prefs : null, // 아이디별 화면 설정(구글시트)
      savePrefs: function (p) { return api({ action: 'savePrefs', token: a.token, prefs: p }).then(function (x) { if (!x.ok) throw new Error(x.err); return x; }); },
      stats: function () { return api({ action: 'stats', token: a.token }).then(function (s) { if (!s.ok) throw new Error(s.err); return s; }); },
      logout: function () { signOut(false); },
      home: function () { go(''); },
    };
    if (!started) { started = true; window.KIMS.init(data, web); } else { window.KIMS.update(data); if (r) window.KIMS.applyPrefs(r.prefs); }
  }
  function loadReport() {
    var a = get();
    if (!a || !a.token) return showGate('login');
    loading = true;
    var day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10), vk = 'kims-visit-' + day, visit = true;
    try { visit = sessionStorage.getItem(vk) !== '1'; } catch (e) {}
    var cached = store(DK);
    if (cached && cached.data) start(JSON.parse(cached.data), a, null); // 저장본으로 즉시 표시
    api({ action: 'data', token: a.token, visit: visit, have: cached ? cached.ver : '' }).then(function (r) {
      loading = false;
      if (!r.ok) { if (r.auth === false) return signOut(true, r.err); throw new Error(r.err); }
      try { sessionStorage.setItem(vk, '1'); } catch (e) {}
      put({ token: a.token, name: r.name, admin: r.admin, email: a.email });
      if (r.same && started) { window.KIMS.applyPrefs(r.prefs); return; } // 데이터는 그대로, 설정만 최신으로
      store(DK, { ver: r.ver, data: r.data });
      start(JSON.parse(r.data), a, r);
    }, function (err) {
      loading = false;
      if (started) return; // 저장본으로 보는 중이면 그대로 둠
      $('main').innerHTML = '<div class="gcard" style="margin:24px auto"><h2>불러오지 못했습니다</h2><p class="gm err">' + esc(err.message) + '</p><button class="gb pri" onclick="location.reload()">다시 시도</button><button class="gb" onclick="location.hash=\'\'">메뉴 화면으로</button></div>';
    });
  }

  if (!API || /API_URL_HERE/.test(API)) { setView('gate'); gate.innerHTML = '<div class="gw one"><form class="gcard"><h2>설정 필요</h2><p class="gm err">Apps Script 웹 앱 주소가 아직 들어 있지 않습니다.</p></form></div>'; gate.hidden = false; return; }
  route();
})();
</script></body></html>
